name: Release package

# Builds the cuda11.8 package and publishes it to the GitHub release page, so
# users can download the built package directly.
#
# Two constraints shape this workflow:
#
#   * GitHub caps a release asset at 2 GiB (2 147 483 648 bytes). The package
#     is ~2.16 GiB, so it is split into parts and a checksum file is published
#     alongside. Reassemble with: cat cuda11.8-*.part-* > pkg.tar.zst
#
#   * The build needs roughly 30 GB of scratch space (4.3 GB installer, ~13 GB
#     extracted tree, ~7 GB staging plus the ~2.2 GB output). A stock
#     ubuntu-latest runner has only ~14 GB free, so unused toolchains are
#     removed first.
#
# Triggered by pushing a tag like v11.8.0-1, or manually via workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v11.8.0-1)"
        required: true

permissions:
  contents: write

env:
  PKG_NAME: cuda11.8

jobs:
  build-and-release:
    name: Build and publish cuda11.8
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # The CUDA build peaks around 30 GB. These toolchains are unrelated to
          # this package and are the standard large consumers on these images.
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/lib/mono || true
          sudo apt-get clean
          docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - name: Verify enough space remains
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "available: ${avail}G"
          if (( avail < 30 )); then
            echo "::error::only ${avail}G free; the build needs about 30G"
            exit 1
          fi

      - name: Resolve the release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publishing: ${tag}"

      - name: Cache the GCC 10 host compiler
        uses: actions/cache@v4
        with:
          # The nvcc smoke test needs an old host compiler. GCC 16 fails against
          # CUDA 11.8, and gcc10 is AUR-only, so it is built once and cached
          # here rather than costing ~40 minutes on every release.
          path: .makepkg/gcc10
          key: gcc10-10.5.0-2-${{ runner.os }}

      - name: Build the package in an Arch Linux container
        run: |
          # Run the whole build inside archlinux so glibc, gcc-10 and pacman match
          # the target distribution exactly.
          #
          # $GITHUB_WORKSPACE rather than $PWD: the mount needs a host-absolute
          # path, and an empty or relative value makes Docker silently create an
          # empty /work instead of bind-mounting.
          #
          # The container script lives in .github/scripts/ because it needs
          # nested quoting, and nested single quotes terminate the outer block.
          work="$GITHUB_WORKSPACE"
          echo "workspace: ${work}"
          test -d "$work" || { echo "::error::workspace ${work} does not exist"; exit 1; }

          mkdir -p "$work/.makepkg/pkg" "$work/.makepkg/build" "$work/.makepkg/src"
          docker run --rm \
            -v "${work}:/work" \
            -w /work \
            -e MAKEPKG_DIR=/work/.makepkg \
            -v "${work}/.github/scripts:/scripts:ro" \
            archlinux:base-devel \
            bash /scripts/build-in-container.sh

      - name: Install verification tooling
        run: |
          # bsdtar reads .pkg.tar.zst. It is not present on the base image.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools

      - name: Verify the built package
        id: verify
        run: |
          shopt -s nullglob
          # The PKGBUILD is a split package: cuda11.8 plus cuda11.8-tools.
          # Both are published, but only the main package is checked for nvcc.
          main=(.makepkg/pkg/cuda11.8-*.pkg.tar.zst)
          if (( ${#main[@]} == 0 )); then
            echo "::error::no main package was produced"
            ls -la .makepkg/pkg || true
            exit 1
          fi
          pkgs=(.makepkg/pkg/*.pkg.tar.zst)

          cudaroot=$(grep -m1 '^_cudaroot=' PKGBUILD | cut -d= -f2)
          for pkg in "${pkgs[@]}"; do
            echo "checking $(basename "$pkg")"
            # A truncated archive is the classic failure; prove it is readable.
            bsdtar -tf "$pkg" >/dev/null
            echo "  archive OK ($(bsdtar -tf "$pkg" | wc -l) entries)"
            bsdtar -tf "$pkg" | grep -qx ".${cudaroot}/bin/nvcc" \
              || { echo "::error::missing ${cudaroot}/bin/nvcc"; exit 1; }
            echo "  contains ${cudaroot}/bin/nvcc"

            # Exercise the packaged compiler rather than only listing it.
            mkdir -p /tmp/nvcc-check && cd /tmp/nvcc-check
            bsdtar -xf "$GITHUB_WORKSPACE/$pkg" ".${cudaroot}/bin/nvcc" \
                                              ".${cudaroot}/include" \
                                              ".${cudaroot}/lib64" 2>/dev/null || true
            cd "$GITHUB_WORKSPACE"
            echo "nvcc reports:"
            "/tmp/nvcc-check${cudaroot}/bin/nvcc" --version | grep -i release || true
          done

          echo "package=${main[0]}" >> "$GITHUB_OUTPUT"

      - name: Split into sub-2GiB parts
        run: |
          # The PKGBUILD is a split package, so there are two artifacts and they
          # are sized independently: cuda11.8 exceeds the 2 GiB asset limit and
          # must be split, while cuda11.8-tools fits comfortably in one asset.
          shopt -s nullglob
          limit=$((2 * 1024 * 1024 * 1024 - 1024 * 1024))   # 2 GiB less 1 MiB
          echo "asset limit: ${limit} bytes"

          mkdir -p release-assets
          for pkg in .makepkg/pkg/*.pkg.tar.zst; do
            base=$(basename "$pkg")
            size=$(stat -c%s "$pkg")
            echo "== ${base} (${size} bytes) =="
            if (( size < limit )); then
              echo "  fits in one asset; publishing as-is"
              cp "$pkg" "release-assets/${base}"
            else
              parts=$(( (size + limit - 1) / limit ))
              echo "  exceeds the limit; splitting into ${parts} parts"
              split -b "$limit" -d --suffix-length=2 "$pkg" "release-assets/${base}.part-"
            fi
          done

          # Checksums must cover BOTH the files actually published and the name
          # the user ends up with after reassembling, otherwise the documented
          # `sha256sum -c SHA256SUMS.txt` fails on the joined file.
          (
            cd release-assets
            : > SHA256SUMS.txt
            for pkg in "$GITHUB_WORKSPACE"/.makepkg/pkg/*.pkg.tar.zst; do
              base=$(basename "$pkg")
              # Whole-package digest, recorded under the reassembled name.
              # Rewrite only the filename field; a greedy sed would eat the
              # digest too, since the digest contains no slash either.
              digest=$(sha256sum "$pkg" | cut -d" " -f1)
              printf "%s  %s\n" "$digest" "$base" >> SHA256SUMS.txt
            done
            # Per-part digests, so a bad download is caught before joining.
            if ls ./*.part-* >/dev/null 2>&1; then
              sha256sum ./*.part-* >> SHA256SUMS.txt
            fi
            cat SHA256SUMS.txt
          )

          echo "=== upload set ==="
          ls -la release-assets/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          pkg="${{ steps.verify.outputs.package }}"
          base=$(basename "$pkg")

          # Document how to install, and how to reassemble a split package, so
          # the release page is self-explanatory.
          split_note=""
          if ls release-assets/*.part-* >/dev/null 2>&1; then
            split_note=$(cat <<EOF

          ### This package is published in parts

          GitHub limits a release asset to 2 GiB and this package is larger, so
          it is split. Reassemble it before installing:

          \`\`\`sh
          cat ${base}.part-* > ${base}
          sha256sum -c SHA256SUMS.txt
          sudo pacman -U ${base}
          \`\`\`
          EOF
          )
          fi

          # Idempotent: re-running a tag updates the existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} exists; uploading/replacing assets"
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "cuda11.8 ${tag}" \
              --notes "$(cat <<EOF
          Arch Linux package for NVIDIA CUDA 11.8, built from the PKGBUILD in
          this repository on an Arch Linux container.

          * \`pkgver\`: $(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)-$(grep -m1 '^pkgrel=' PKGBUILD | cut -d= -f2)
          * two packages: \`cuda11.8\` (compiler and libraries) and
            \`cuda11.8-tools\` (nsight, nvvp; optional)
          * \`nvcc\`: 11.8.89
          * installs to \`/opt/cuda-11.8\` so it coexists with any other CUDA
          * verified to contain a working \`nvcc\` and a readable archive

          Install with \`sudo pacman -U <package>\`.
          ${split_note}
          EOF
          )"
          fi

          echo "=== release contents ==="
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
