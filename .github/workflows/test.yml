name: Test packaging metadata

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate PKGBUILD and .SRCINFO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.13

      - name: Run the packaging test suite
        run: uv run --with pytest --with requests pytest tests/ -v

      - name: Fail if secrets were ever committed
        run: |
          # Defence in depth: a token reaching the repository is unrecoverable
          # even if a later commit deletes it.
          if git ls-files | grep -qx '.env'; then
            echo "::error::.env is tracked; a credential has been published"
            exit 1
          fi
          if git grep -nE 'github_pat_[A-Za-z0-9_]{20,}' -- . ':!*.example' ':!tests/*'; then
            echo "::error::a GitHub token was found in the working tree"
            exit 1
          fi
          echo "no committed secrets detected"

      - name: Verify .SRCINFO matches the PKGBUILD
        run: |
          # makepkg is unavailable on the runner, so compare the fields the
          # AUR actually reads against the PKGBUILD.
          pkgver=$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)
          if ! grep -q "^	pkgver = ${pkgver}$" .SRCINFO; then
            echo "::error::.SRCINFO pkgver does not match PKGBUILD ($pkgver)"
            exit 1
          fi
          echo ".SRCINFO agrees with PKGBUILD"

  upstream:
    name: Check the NVIDIA installer is still published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the source URL resolves
        run: |
          # A dead or moved installer is the most common way this PKGBUILD
          # silently rots, and it cannot be caught by parsing files locally.
          # Only a HEAD request is issued, so the 4.3 GB payload is not
          # downloaded; this keeps the job cheap enough to run on every push.
          pkgver=$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)
          driverver=$(grep -m1 '^_driverver=' PKGBUILD | cut -d= -f2)
          file="cuda_${pkgver}_${driverver}_linux.run"
          url="https://developer.download.nvidia.com/compute/cuda/${pkgver}/local_installers/${file}"

          echo "checking ${url}"
          code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$url")
          if [ "$code" != "200" ]; then
            echo "::error::${file} is not downloadable (HTTP ${code})"
            exit 1
          fi

          size=$(curl -sIL --max-time 60 "$url" \
                 | awk 'BEGIN{IGNORECASE=1} /^content-length:/{v=$2} END{gsub(/\r/,"",v); print v}')
          echo "::notice::${file} is available (${size} bytes)"
